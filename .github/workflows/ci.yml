name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # installs the Bun version from "packageManager" in package.json
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # builds the image, starts it and waits for its health check to pass
      - run: docker compose up --build --wait
      - run: curl --fail http://127.0.0.1:3000/health
