services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # published on every host interface, use "127.0.0.1:3000:3000" to keep it behind a reverse proxy
      - "${APP_PORT:-3000}:3000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
